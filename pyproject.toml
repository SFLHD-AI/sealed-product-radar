[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tpx-dealernet-edge"
version = "0.1.0"
description = "TPX <-> Dealernet edge finder for sealed wax / sealed TCG (read-only)"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "PyYAML>=6.0",
    "rapidfuzz>=3.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
scrape = ["playwright>=1.45"]

[project.scripts]
edge = "edge.cli:app"

[tool.setuptools.packages.find]
include = ["edge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
